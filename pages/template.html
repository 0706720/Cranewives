<!DOCTYPE html>

<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>To-Do App</title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="style.css">
    </head>
    <body onload="startUp()">
        <div class="navigationbar">
            <button class="spaced" id="Home" onclick="home()">Home</button>
            <button class="spaced" id="Albums" onclick="albums()">Albums</button>
            <button class="spaced" id="All Songs" onclick="allsongs()">All Songs</button>
            <button class="spaced" id="Search" onclick="search()">Search</button>
            <span class="dropdown">
                <button class="spaced dropbtn" id="Favourites" onclick="favourites()">Favourites
                    <i class="fa fa-caret-down"></i>
                </button>
                <div class="dropdown-content">
                    <p>Add song to favourites</p>
                    <p>Remove song from favourites</p> 
                </div>
            </span>
            <button class="spaced" id="Save" onclick="save()">Save</button>
            <span class="spaced large">||</span>
            <span id="hide">
                <button class="spaced notapplicable" id="random" onclick="randomShuffle()">Randomise</button>
                <button class="spaced notapplicable" id="original" onclick="originalShuffle()">Start</button>
                <button class="spaced notapplicable" id="next" onclick="next()">Next</button>
                <button class="spaced notapplicable" id="previous" onclick="previous()">Previous</button>
            </span>
        </div>
    </body>
